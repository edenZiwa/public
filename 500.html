<!doctype html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Server Error | Garden of Mercy Foundation</title>
  <link rel="shortcut icon" href="./images/garden_of_mercy_logo.png" type="image/x-icon" />

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    rel="stylesheet"
  >

</head>

<body>

<main class="error-page">

  <div class="container py-5 text-center">

    <div class="error-icon">
      <i class="bi bi-exclamation-triangle"></i>
    </div>

    <div class="display-1 fw-bold text-success">
      500
    </div>

    <h1 class="fw-bold">
      Something went wrong
    </h1>

    <p class="lead text-secondary">
      We encountered an unexpected server error.
      Please try again shortly.
    </p>

    <div class="d-flex justify-content-center gap-2">

      <button
        class="btn btn-outline-secondary btn-lg"
        onclick="location.reload()"
      >
        Try Again
      </button>

      <a
        href="./index.html"
        class="btn btn-success btn-lg"
      >
        Return Home
      </a>

    </div>

  </div>

</main>

</body>
</html>
